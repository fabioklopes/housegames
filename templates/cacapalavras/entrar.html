{% extends 'base.html' %}
{% block titulo %}Entrar na partida{% endblock %}
{% block cabecalho %}Entrar na partida{% endblock %}
{% block conteudo %}
<div class="cartao">
    <h2>Partida {{ partida.codigo }}</h2>
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Seu apelido
            <input type="text" name="apelido" maxlength="30" required autofocus>
        </label>
        <button class="botao" type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
