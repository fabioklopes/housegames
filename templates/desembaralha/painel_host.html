{% extends 'base.html' %}
{% load static %}
{% block titulo %}Painel do mediador{% endblock %}
{% block cabecalho %}Painel do mediador{% endblock %}
{% block conteudo %}
<div class="cartao">
    <p>Partida <strong>{{ partida.codigo }}</strong> — <span id="status-fase">carregando...</span></p>
    <div id="banner-campeao" style="display:none; text-align:center; font-size:20px; margin-bottom:12px;"></div>
    <table class="tabela-resultado">
        <thead>
        <tr><th>Jogador</th><th>Acertos</th><th>Pontos</th><th>Situação</th></tr>
        </thead>
        <tbody id="tabela-participantes"></tbody>
    </table>
</div>
{% endblock %}
{% block js_extra %}
<script>
    const URL_ESTADO_HOST = "{% url 'desembaralha_estado_host' codigo=partida.codigo %}";
</script>
<script src="{% static 'desembaralha/js/painel_host.js' %}"></script>
{% endblock %}
